name: Test Bounty Fix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Verify server-side rendering
        run: |
          echo "Checking for server-side rendering..."
          if grep -q "async function renderHomePage(nonce: string, db: D1Database)" src/index.ts; then
            echo "✅ Server-side rendering detected"
          else
            echo "❌ Server-side rendering not found"
            exit 1
          fi

      - name: Verify database query
        run: |
          echo "Checking database query..."
          if grep -q "SELECT b.*, a.display_name as creator_name FROM bounties b LEFT JOIN agents a" src/index.ts; then
            echo "✅ Database query found"
          else
            echo "❌ Database query not found"
            exit 1
          fi

      - name: Verify bounty list rendering
        run: |
          echo "Checking bounty list rendering..."
          if grep -q "bounties.forEach" src/index.ts; then
            echo "✅ Bounty list rendering found"
          else
            echo "❌ Bounty list rendering not found"
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Test Results ✅"
          echo ""
          echo "All checks passed!"
          echo ""
          echo "The fix includes:"
          echo "- Server-side rendering of bounty list"
          echo "- Database query to fetch bounties"
          echo "- HTML rendering for curl/agent access"